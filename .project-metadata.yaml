name: ML Ops Hands on Lab 
description: "Prototype to demonstrate machine learning operations in production"
author: "Cloudera"
date: "2025-12-11"
specification_version: 1.0
prototype_version: 1.0
environment_variables:

  CONNECTION_NAME:
    default: "go01-aw-dl"
    description: "datalake connection name"
runtimes: 
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Standard
    version: "2026.08"
    addons: [Spark 3.5.4 - CDE 1.25.2]
    
tasks:
  - type: run_session
    name: Install Dependencies
    script: shared_utils/install-dependencies.py
    short_summary: Install Dependencies
    kernel: python3
    cpu: 8
    memory: 16

